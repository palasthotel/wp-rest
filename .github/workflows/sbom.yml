name: SBOM

# The CycloneDX SBOM of a release - the runtime dependencies a project gets when it
# installs the package, read from package-lock.json without the devDependencies -,
# attached to the GitHub release and sent to Dependency-Track as
# "palasthotel/wp-rest (npm)" by the shared workflows of palasthotel/github-workflows.
#
# A workflow of its own, not a step of publish.yml: an SBOM that can't be made must not
# stop a release. "Run workflow" gives a released version its SBOM later - see
# https://github.com/palasthotel/github-workflows/blob/main/docs/sbom.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, without the leading v (e.g. 2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sbom:
    uses: palasthotel/github-workflows/.github/workflows/npm-package-sbom.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ github.event.inputs.version }}

  dependency-track:
    needs: sbom
    uses: palasthotel/github-workflows/.github/workflows/dependency-track-upload.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.sbom.outputs.version }}
