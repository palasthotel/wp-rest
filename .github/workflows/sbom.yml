name: SBOM

# Writes the CycloneDX SBOM of a release - the runtime dependencies a project gets when
# it installs the package, read from package-lock.json without the devDependencies -,
# attaches it to the GitHub release and sends it to Dependency-Track as
# "palasthotel/wp-rest (npm)" via the shared upload workflow.
#
# A workflow of its own, not a step of publish.yml: an SBOM that can't be made must not
# stop a release. "Run workflow" gives a version released before this workflow its SBOM
# - see https://github.com/palasthotel/github-workflows/blob/main/docs/sbom.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the released version, e.g. v1.1.0 (or 1.0.2 for the releases before release-please)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Pinned: the SBOM format must not change between two releases by accident
      CYCLONEDX_NPM_VERSION: "7.0.1"
    steps:
      - name: Version from the tag
        id: version
        run: |
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag, also on a dispatch run: the SBOM describes what was released
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # --package-lock-only: nothing is installed, no install script runs
      - name: Write the SBOM
        run: |
          mkdir -p sbom
          npx --yes "@cyclonedx/cyclonedx-npm@$CYCLONEDX_NPM_VERSION" \
            --package-lock-only \
            --omit dev \
            --mc-type library \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom/sbom-npm.cdx.json
          jq -r '"\(.metadata.component.name)@\(.metadata.component.version): \(.components | length) components"' sbom/sbom-npm.cdx.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom/sbom-npm.cdx.json --clobber
          else
            echo "::notice::No GitHub release for $TAG - the SBOM goes to Dependency-Track only"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  dependency-track:
    needs: sbom
    uses: palasthotel/github-workflows/.github/workflows/dependency-track-upload.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.sbom.outputs.version }}
